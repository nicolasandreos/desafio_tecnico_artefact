[project]
name = "desafiotecnicoartefact"
version = "0.1.0"
description = "Portuguese customer-service agent for Emporio da Musica."
readme = "README.md"
authors = [
    { name = "Nicolas", email = "nicolasandreose@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "agno[os,sqlite,openai,chromadb,knowledge,pdf]",
    "openai",
    "chromadb",
    "pandas",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emporio_agent"]

[tool.hatch.build.targets.wheel.force-include]
"src/emporio_agent/data/schema.sql" = "emporio_agent/data/schema.sql"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "D"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]
